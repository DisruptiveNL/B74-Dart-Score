org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Cannot go to true on Flutter 3.44, though Flutter warns that a future version
# will refuse to build an app whose plugins apply the Kotlin Gradle Plugin.
#
# The blocker is Flutter's own Gradle plugin, not the packages. Look at
# FlutterPluginUtils.kt in packages/flutter_tools/gradle: it walks every
# subproject and applies `kotlin-android` to any that uses AGP without
# declaring KGP itself, with no check on this flag. So plugins that contain no
# Kotlin at all, gal for one, get KGP applied to them and AGP 9 then refuses
# the build. Nothing that can be fixed from here, and no version of those
# packages helps.
#
# Flutter 3.47 is the version that stops doing this. Turning the flag on will
# also mean raising share_plus and package_info_plus, which are currently
# capped for the opposite reason (see pubspec.yaml).
android.builtInKotlin=false
# Take the barcode model out of the app and let Play Services supply it.
# Bundled, it costs around 20 MB of the download for a screen most users open
# once, when they move to a new device. Unbundled it is a few hundred KB, at
# the price of the model being fetched before the first scan; the DEPENDENCIES
# meta-data in AndroidManifest.xml asks for that at install time, so in
# practice it is already there by the time anyone scans.
dev.steenbakker.mobile_scanner.useUnbundled=true
kotlin.incremental=false
