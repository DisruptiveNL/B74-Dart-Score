name: dartscore_app
description: "Dart Score Tracker App"
publish_to: 'none'

version: 1.1.0+202600020

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  # Deliberately NOT on 13.3.0. From 13.2 on, share_plus stops applying the
  # Kotlin Gradle Plugin at AGP 9 and expects AGP's built-in Kotlin to compile
  # it instead. This project cannot turn that on yet (see
  # android/gradle.properties), so its Kotlin never gets compiled and the build
  # dies on an unresolved SharePlusPendingIntent. Same story for
  # package_info_plus. Raise both once built-in Kotlin is on.
  share_plus: '>=13.1.0 <13.2.0'
  qr_flutter: ^4.1.0
  # 7.4.0 decides by the actual setting whether to apply the Kotlin Gradle
  # Plugin, so it builds both before and after the built-in Kotlin migration.
  # That makes it the one of the three that can be raised today.
  mobile_scanner: ^7.4.0
  gal: ^2.3.2
  path_provider: ^2.1.5
  # Held back for the same reason as share_plus.
  package_info_plus: '>=10.1.0 <10.2.0'
  url_launcher: ^6.3.2
  in_app_purchase: ^3.2.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # Runs SQLite in the Dart VM so provider tests can drive a real database
  # instead of mocking DbHelper away.
  sqflite_common_ffi: ^2.3.4
  # Lets the donation test stand in for the store, so it can assert that
  # starting the app asks it for nothing.
  in_app_purchase_platform_interface: ^1.4.0
  plugin_platform_interface: ^2.1.8
  # Drives the app on a real simulator or emulator so the store screenshots are
  # rendered by the platform that will run the shipped build. A widget test
  # cannot stand in: it paints with the test font instead of the system one.
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
  # assets/icon/app_icon.png is deliberately not bundled: flutter_launcher_icons
  # reads it from the source tree when generating the launcher icons, and
  # nothing loads it at runtime. Declaring it would ship 270 KB unused.
